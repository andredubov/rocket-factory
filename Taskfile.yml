      - docker compose -f deploy/compose/inventory/docker-compose.yaml logs --tail=50
      - echo "--- Payment logs ---"
      - docker compose -f deploy/compose/payment/docker-compose.yaml logs --tail=50
      - echo "--- Order logs ---"
