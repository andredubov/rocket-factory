services:

  placeholder:
    image: alpine:3.22.1
    command: [ "sh", "-c", "echo 'This is a placeholder service' && sleep infinity" ]
    networks:
      rocketfactory-net:
        ipv4_address: 172.19.0.2

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT}:${KAFKA_INTERNAL_PORT}"
    env_file:
      - .env
    environment:
      KAFKA_KRAFT_MODE: "true"
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:${KAFKA_CONTROLLER_PORT}"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:${KAFKA_INTERNAL_PORT},PLAINTEXT_EXTERNAL://0.0.0.0:${KAFKA_EXTERNAL_PORT},CONTROLLER://kafka:${KAFKA_CONTROLLER_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:${KAFKA_INTERNAL_PORT},PLAINTEXT_EXTERNAL://kafka:${KAFKA_EXTERNAL_PORT},CONTROLLER://kafka:${KAFKA_CONTROLLER_PORT}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "Mk3OEYBSD34fcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD", "bash", "-c", "echo > /dev/tcp/kafka/${KAFKA_INTERNAL_PORT}" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2'
        reservations:
          memory: 512M
          cpus: '1'
    networks:
      rocketfactory-net:
        ipv4_address: 172.19.0.3

  kafka-init:
    image: confluentinc/cp-kafka:7.9.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    env_file:
      - .env
    command: >
      bash -c "
        echo 'Creating Kafka topics...'
        kafka-topics --bootstrap-server kafka:${KAFKA_INTERNAL_PORT} --create --topic ${KAFKA_ORDER_PAID_TOPIC_NAME} --partitions 1 --replication-factor 1 --if-not-exists
        kafka-topics --bootstrap-server kafka:${KAFKA_INTERNAL_PORT} --create --topic ${KAFKA_ORDER_ASSEMBLED_TOPIC_NAME} --partitions 1 --replication-factor 1 --if-not-exists
        echo 'Topics created successfully!'
        kafka-topics --bootstrap-server kafka:${KAFKA_INTERNAL_PORT} --list
      "
    networks:
      rocketfactory-net:
        ipv4_address: 172.19.0.4

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    ports:
      - "${KAFKA_UI_PORT}:8080"
    env_file:
      - .env
    environment:
      KAFKA_CLUSTERS_0_NAME: "local-cluster"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka:${KAFKA_INTERNAL_PORT}"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      rocketfactory-net:
        ipv4_address: 172.19.0.5

  otel-collector:
    # Официальный образ OTel Collector с дополнительными компонентами
    # contrib версия включает экспортеры для разных систем (Elasticsearch, Prometheus, etc.)
    image: otel/opentelemetry-collector-contrib:0.123.0
    container_name: otel-collector
    command: [ "--config=/etc/otel-collector-config.yaml" ]
    volumes:
      - ./otel/collector.yaml:/etc/otel-collector-config.yaml
    ports:
      - "${OTEL_COLLECTOR_METRICS_EXTERNAL_PORT}:${OTEL_COLLECTOR_METRICS_INTERNAL_PORT}"
      - "${OTEL_COLLECTOR_EXTERNAL_GRPC_PORT}:${OTEL_COLLECTOR_INTERNAL_GRPC_PORT}"
      - "${OTEL_COLLECTOR_EXTERNAL_HTTP_PORT}:${OTEL_COLLECTOR_INTERNAL_HTTP_PORT}"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--spider", "http://localhost:${OTEL_COLLECTOR_METRICS_INTERNAL_PORT}/metrics" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      rocketfactory-net:
        ipv4_address: 172.19.0.6
    depends_on:
      elasticsearch:
        condition: service_healthy
      prometheus:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.4
    container_name: elasticsearch
    environment:
      # РЕЖИМ ОДНОГО УЗЛА: Elasticsearch запускается как single-node кластер
      # В production обычно используется multi-node кластер для отказоустойчивости
      - discovery.type=single-node
      # ОТКЛЮЧЕНИЕ БЕЗОПАСНОСТИ: упрощает настройку для обучения
      # В production ОБЯЗАТЕЛЬНО включать аутентификацию и HTTPS
      - xpack.security.enabled=false
      # ИМЯ КЛАСТЕРА: логическое имя для группировки узлов
      - cluster.name=es-docker-cluster
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      # Через этот порт OTel Collector отправляет логи
      - "${ELASTICSEARCH_EXTERNAL_PORT}:${ELASTICSEARCH_INTERNAL_PORT}"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://localhost:${ELASTICSEARCH_INTERNAL_PORT}/_cluster/health >/dev/null" ]
      interval: 10s # проверяем каждые 10 секунд
      timeout: 5s # ждем ответ максимум 5 секунд
      retries: 20 # максимум 20 попыток (итого ~3 минуты)
      start_period: 30s # ждем 30 секунд перед первой проверкой
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
    networks:
      rocketfactory-net:
        ipv4_address: 172.19.0.7

  kibana:
    # Официальный образ Kibana той же версии, что и Elasticsearch
    # Важно: версии Kibana и Elasticsearch должны совпадать!
    image: docker.elastic.co/kibana/kibana:9.0.4
    container_name: kibana
    environment:
      # ПОДКЛЮЧЕНИЕ К ELASTICSEARCH: указываем адрес Elasticsearch
      # Используем имя контейнера 'elasticsearch' как DNS имя
      - ELASTICSEARCH_HOSTS=http://elasticsearch:${ELASTICSEARCH_INTERNAL_PORT}
      # ОТКЛЮЧЕНИЕ БЕЗОПАСНОСТИ: соответствует настройкам Elasticsearch
      - XPACK_SECURITY_ENABLED=false
    depends_on:
      # ЗАВИСИМОСТЬ ОТ ELASTICSEARCH: Kibana запустится только после того,
      # как Elasticsearch будет healthy (пройдет healthcheck)
      elasticsearch:
        condition: service_healthy
    ports:
      # ПОРТ 5601: веб-интерфейс Kibana
      # Открываем в браузере http://localhost:5601 для просмотра логов
      - "${KIBANA_EXTERNAL_PORT}:${KIBANA_INTERNAL_PORT}"
    healthcheck:
      # ПРОВЕРКА ЗДОРОВЬЯ KIBANA: проверяем готовность веб-интерфейса
      test: [ "CMD-SHELL", "curl -fsS http://localhost:${KIBANA_INTERNAL_PORT}/api/status >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped
    networks:
      rocketfactory-net:
        ipv4_address: 172.19.0.8

  kibana-init:
    # Легкий Alpine Linux образ для выполнения скриптов инициализации
    image: alpine:3.22.1
    container_name: kibana-init
    depends_on:
      # ЖДЕМ ГОТОВНОСТИ KIBANA: запускаемся только после успешного healthcheck
      kibana:
        condition: service_healthy

    # КОМАНДА ИНИЦИАЛИЗАЦИИ: выполняется один раз при запуске контейнера
    command:
      - sh # запускаем shell
      - -c # выполняем команду из строки
      - | # многострочная команда (YAML literal block)
        set -e  # останавливаем скрипт при первой ошибке

        # УСТАНОВКА УТИЛИТ: curl для HTTP запросов, jq для обработки JSON
        echo "Installing curl and jq..."
        apk add --no-cache curl jq >/dev/null 2>&1

        # ОЖИДАНИЕ ГОТОВНОСТИ KIBANA: дополнительная проверка доступности API
        echo "Waiting for Kibana..."
        for i in $$(seq 1 60); do  # максимум 60 попыток (2 минуты)
          if curl -sSf http://kibana:${KIBANA_INTERNAL_PORT}/api/status >/dev/null; then break; fi
          sleep 2  # ждем 2 секунды между попытками
        done

        # СОЗДАНИЕ DATA VIEW: настраиваем Kibana для просмотра логов
        echo "Creating Data View otel-logs* ..."
        # Создаем Data View через Kibana API
        RESPONSE=$$(curl -sS -X POST http://kibana:${KIBANA_INTERNAL_PORT}/api/data_views/data_view \
          -H "kbn-xsrf: true" \
          -H "Content-Type: application/json" \
          --data '{"data_view":{"title":"otel-logs*","name":"Rocket Factory Logs","timeFieldName":"@timestamp","allowNoIndex":true},"override":true}' || echo "{}")

        # ИЗВЛЕЧЕНИЕ ID DATA VIEW: парсим JSON ответ для получения ID
        echo "Response: $$RESPONSE"
        DATA_VIEW_ID=$$(echo "$$RESPONSE" | jq -r ".data_view.id // empty")
        echo "Data View ID: $$DATA_VIEW_ID"

        # УСТАНОВКА КАК DEFAULT DATA VIEW: чтобы Kibana автоматически использовал его
        if [ -n "$$DATA_VIEW_ID" ]; then
          echo "Setting as default data view..."
          curl -sS -X POST http://kibana:${KIBANA_INTERNAL_PORT}/api/data_views/default \
            -H "kbn-xsrf: true" \
            -H "Content-Type: application/json" \
            -d "{\"data_view_id\": \"$$DATA_VIEW_ID\", \"force\": true}" || true
          echo "Default data view set successfully."
        else
          echo "Failed to get data view ID"
        fi
        echo "Done."
    networks:
      rocketfactory-net:
        ipv4_address: 172.19.0.9
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.3.1
    container_name: prometheus
    ports:
      - "${PROMETHEUS_EXTERNAL_PORT}:${PROMETHEUS_INTERNAL_PORT}"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml' # Указываем путь к файлу конфигурации
      - '--storage.tsdb.path=/prometheus' # Директория для хранения временных рядов
      - '--web.enable-lifecycle' # Включает HTTP API для управления Prometheus
      - '--web.enable-remote-write-receiver' # Включает поддержку remote write API для приема метрик
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--spider", "http://localhost:${PROMETHEUS_INTERNAL_PORT}/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      rocketfactory-net:
        ipv4_address: 172.19.0.10

  grafana:
    image: grafana/grafana:12.0.0
    container_name: grafana
    ports:
      - "${GRAFANA_EXTERNAL_PORT}:${GRAFANA_INTERNAL_PORT}"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--spider", "http://localhost:${GRAFANA_INTERNAL_PORT}/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      rocketfactory-net:
        ipv4_address: 172.19.0.11

  jaeger:
    # Сервис Jaeger для распределенной трассировки
    image: jaegertracing/jaeger:2.6.0 # Последняя стабильная версия Jaeger v2
    container_name: jaeger # Имя контейнера для удобного обращения
    ports:
      - "${JAEGER_UI_EXTERNAL_PORT}:${JAEGER_UI_INTERNAL_PORT}" # Порт для веб-интерфейса Jaeger UI
    environment:
      - COLLECTOR_OTLP_ENABLED=true # Включаем поддержку протокола OpenTelemetry
      - STORAGE_TYPE=badger # Используем Badger как хранилище данных (встроенная key-value БД)
      - BADGER_EPHEMERAL=false # Сохраняем данные на диск между перезапусками
      - BADGER_DIRECTORY_VALUE=/badger/data # Директория для хранения значений (спаны, теги, логи)
      - BADGER_DIRECTORY_KEY=/badger/key # Директория для хранения индексов (для быстрого поиска)
    volumes:
      - jaeger_data:/badger/data # Том для хранения данных трейсов
      - jaeger_key:/badger/key # Том для хранения индексов
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "localhost:${JAEGER_UI_INTERNAL_PORT}" ] # Проверка доступности UI
      interval: 5s # Интервал проверки
      timeout: 3s # Таймаут проверки
      retries: 3 # Количество попыток
      start_period: 5s # Время ожидания перед началом проверок
    restart: unless-stopped
    networks:
      rocketfactory-net:
        ipv4_address: 172.19.0.12

  envoy:
    image: envoyproxy/envoy:v1.34.0
    container_name: envoy
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml
      - ../../../shared/pkg/proto/descriptor.pb:/etc/envoy/descriptor.pb
    ports:
      - "${ENVOY_PORT}:8080"
      - "${ENVOY_ADMIN_PORT}:8081"
    healthcheck:
      test: [ "CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/8081'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      rocketfactory-net:
        ipv4_address: 172.19.0.23

volumes:
  kafka_data:
    name: core_kafka_volume
  elasticsearch_data:
    name: core_elasticsearch_volume
  prometheus_data:
    name: core_prometheus_data
  grafana_data:
    name: core_grafana_data
  jaeger_data:
    name: core_jaeger_data
  jaeger_key:
    name: core_jaeger_key

networks:
  rocketfactory-net:
    name: rocketfactory-net
    external: false
    driver: bridge
    ipam:
      config:
        - subnet: 172.19.0.0/24
          gateway: 172.19.0.1
    # ВАЖНО: здесь мы создаём сеть с именем rocketfactory-net
    # Другие docker-compose файлы будут к ней подключаться с external: true
