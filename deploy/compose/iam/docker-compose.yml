services:
  # Раздел, описывающий контейнеры, которые требуются для работы IAM-сервиса
  iam-service:
    image: iam-service:1.0.0
    container_name: iam_service
    build:
      context: ../../..
      dockerfile: ./iam/Dockerfile
    env_file:
      - .env
    ports:
      - ${GRPC_PORT}:${GRPC_PORT}
    depends_on:
      iam-postgres:
        condition: service_healthy
      iam-redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "grpc_health_probe", "-addr=:${GRPC_PORT}" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      rocketfactory-net:
        ipv4_address: 172.19.0.10

  iam-postgres:
    # Контейнер с PostgreSQL, используемый для хранения данных заказов
    image: ${PG_IMAGE_NAME}
    # Используем официальный образ PostgreSQL версии 17 на базе Alpine Linux
    # Это лёгкая и быстрая сборка, которая экономит ресурсы
    container_name: iam_postgres
    environment:
      # Переменные окружения, используемые при запуске контейнера
      POSTGRES_DB: ${PG_DB} # Имя базы данных, которая будет создана при запуске
      POSTGRES_USER: ${PG_USER} # Имя пользователя, создаваемого в базе
      POSTGRES_PASSWORD: ${PG_PASSWORD} # Пароль для указанного пользователя
    volumes:
      - iam_postgres_volume:/var/lib/postgresql/data
      # Определяем том, который будет использоваться для хранения данных PostgreSQL
      # Он сохраняет данные между перезапусками контейнера
    ports:
      - "${EXTERNAL_PG_PORT}:${INTERNAL_PG_PORT}"
      # Пробрасываем внутренний порт PostgreSQL (${PG_PORT}) на порт хоста (${PG_PORT_OUT})
      # Это нужно, чтобы другие сервисы или инструменты могли подключиться к базе
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}" ]
      # Настраиваем проверку готовности контейнера — pg_isready проверяет, принимает ли база подключения
      interval: 10s # Интервал между проверками — каждые 10 секунд
      timeout: 5s # Время ожидания ответа от проверки
      retries: 10 # После 10 неудачных попыток подряд контейнер считается "unhealthy"
      start_period: 10s # 10 секунд на запуск
    restart: unless-stopped
    # Автоматически перезапускаем контейнер, если он аварийно завершился
    # Если контейнер был остановлен вручную — не перезапускаем
    networks:
      rocketfactory-net:
        ipv4_address: 172.19.0.11
      # Подключаемся к общей сети, чтобы другие микросервисы (например, Order-сервис) могли найти этот контейнер по имени "postgres-order"

  iam-redis:
    # Redis — кэш и хранилище сессий для IAM
    image: redis:7.2.5-alpine3.20 # Лёгкий образ Redis последней стабильной версии
    container_name: iam_redis # Явное имя контейнера Redis
    env_file:
      - .env
    ports:
      - "${EXTERNAL_REDIS_PORT}:${INTERNAL_REDIS_PORT}"
      # Пробрасываем внутренний порт Redis на внешний, указанный в .env (например, 6380)
      # Это позволяет IAM-сервису обращаться к Redis по порту хоста
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s # Проверяем Redis каждые 10 секунд
      timeout: 5s # Ждём ответа до 5 секунд
      retries: 5 # После 5 неудачных попыток контейнер считается unhealthy
    restart: unless-stopped
    # Автоматически перезапускаем контейнер, если он аварийно завершился
    # Если контейнер был остановлен вручную — не перезапускаем
    networks:
      rocketfactory-net:
        ipv4_address: 172.19.0.12
      # Подключаемся к общей сети, чтобы другие микросервисы (например, IAM-сервис) могли найти этот контейнер по имени "iam-redis"

volumes:
  # Раздел с томами — определяем, какие дисковые ресурсы создаёт и использует Docker
  iam_postgres_volume:
    name: iam_postgres_volume
    # Именованный том для хранения данных Order-сервиса в PostgreSQL
    # Позволяет сохранять состояние базы даже после перезапуска контейнера

networks:
  # Сетевые настройки
  rocketfactory-net:
    external: true
    # Мы не создаём новую сеть, а подключаемся к уже существующей общей сети "rocketfactory-net"
    # Эта сеть создаётся один раз в docker-compose.yml или вручную через docker network create
