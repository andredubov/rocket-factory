type: object
description: |
  Данные для создания нового заказа.
  Должен содержать UUID пользователя и хотя бы один UUID детали.
required: [user_uuid, part_uuids]
properties:
  user_uuid:
    type: string
    format: uuid
    description: Уникальный идентификатор пользователя
    example: "a3b8f4d2-1c7e-4a9b-8f6d-3e2c1a9b7f5d"
  part_uuids:
    type: array
    items:
      type: string
      format: uuid
    description: Список идентификаторов деталей для заказа
    minItems: 1
    example: ["f8e7d6c5-4b3a-2c1d-9f0e-8d7c6b5a4f3e", "c5e9a2b8-7d3f-4c1a-9e6b-2d8f4a7c1b3e"]